name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/portfolio-images

jobs:
  # ── Job 1: Frontend lint + type-check ───────────────────────────────────────
  lint-frontend:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Dependency audit
        run: npm audit --audit-level=critical --omit=dev
        working-directory: frontend

  # ── Job 2: Backend lint + security audit ────────────────────────────────────
  lint-backend:
    name: Backend — Tests, Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install test & audit tools
        run: pip install --quiet pytest bandit pip-audit

      - name: Unit tests
        run: python -m pytest -q tests
        working-directory: backend

      - name: Bandit security lint
        run: bandit -r app/ --severity-level medium --confidence-level medium --format txt
        working-directory: backend

      - name: pip-audit
        run: pip-audit --requirement requirements.txt --strict
        working-directory: backend

  # ── Job 3: Dockerfile lint ───────────────────────────────────────────────────
  lint-dockerfiles:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  # ── Job 4: End-to-end tests against the full stack ──────────────────────────
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: e2e-admin-token
      DEEPSEEK_API_KEY: unused-chat-is-stubbed
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Seed database
        run: docker compose exec -T backend python seed.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      # runs on the runner's preinstalled Google Chrome (channel: chrome)
      - name: Playwright
        run: npx playwright test
        working-directory: frontend

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=100

  # ── Job 5: Build & Deploy ────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, lint-dockerfiles, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe portfolio-images \
            --location=${{ secrets.GCP_REGION }} --quiet 2>/dev/null || \
          gcloud artifacts repositories create portfolio-images \
            --repository-format=docker \
            --location=${{ secrets.GCP_REGION }} \
            --quiet

      - name: Build & push backend
        env:
          DOCKER_BUILDKIT: 1
          TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag $REGISTRY/backend:${TAG:0:7} \
            --tag $REGISTRY/backend:latest \
            --cache-from $REGISTRY/backend:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            backend/
          docker push $REGISTRY/backend:${TAG:0:7}
          docker push $REGISTRY/backend:latest

      - name: Build & push frontend
        env:
          DOCKER_BUILDKIT: 1
          TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag $REGISTRY/frontend:${TAG:0:7} \
            --tag $REGISTRY/frontend:latest \
            --cache-from $REGISTRY/frontend:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg NEXT_PUBLIC_API_URL="" \
            frontend/
          docker push $REGISTRY/frontend:${TAG:0:7}
          docker push $REGISTRY/frontend:latest

      - name: Deploy backend to Cloud Run
        env:
          TAG: ${{ github.sha }}
        run: |
          gcloud run deploy portfolio-backend \
            --image=$REGISTRY/backend:${TAG:0:7} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONN }} \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,ADMIN_TOKEN=ADMIN_TOKEN:latest \
            --set-env-vars=FLASK_ENV=production \
            --min-instances=0 \
            --max-instances=4 \
            --memory=512Mi \
            --quiet

      - name: Deploy frontend to Cloud Run
        env:
          TAG: ${{ github.sha }}
        run: |
          BACKEND_URL=$(gcloud run services describe portfolio-backend \
            --region=${{ secrets.GCP_REGION }} --format="value(status.url)")
          # Public URL for absolute OG-image links: a custom domain from the SITE_URL
          # repo variable if set, else the existing Cloud Run URL (empty on first deploy)
          SITE_URL="${{ vars.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL=$(gcloud run services describe portfolio-frontend \
              --region=${{ secrets.GCP_REGION }} --format="value(status.url)" 2>/dev/null || true)
          fi
          gcloud run deploy portfolio-frontend \
            --image=$REGISTRY/frontend:${TAG:0:7} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --set-env-vars=NODE_ENV=production,BACKEND_URL=$BACKEND_URL,NEXT_TELEMETRY_DISABLED=1${SITE_URL:+,SITE_URL=$SITE_URL} \
            --min-instances=1 \
            --max-instances=4 \
            --memory=512Mi \
            --quiet

      - name: Print deployed URLs
        run: |
          BACKEND_URL=$(gcloud run services describe portfolio-backend \
            --region=${{ secrets.GCP_REGION }} --format="value(status.url)")
          FRONTEND_URL=$(gcloud run services describe portfolio-frontend \
            --region=${{ secrets.GCP_REGION }} --format="value(status.url)")
          echo "====================================="
          echo "Frontend : $FRONTEND_URL"
          echo "Backend  : $BACKEND_URL"
          echo "====================================="
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $FRONTEND_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | $BACKEND_URL |" >> $GITHUB_STEP_SUMMARY
